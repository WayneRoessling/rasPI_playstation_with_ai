# Scenarios catalog — registry of every authored scenario overlay
#
# Each entry is the canonical handle for a scenario. The full prose lives
# in overlay/narratives/scenarios/<id>/narrative.md and a machine-readable
# YAML in overlay/narratives/scenarios/<id>/_emitted/scenario.yaml
# (regenerated by overlay/tools/emit_scenarios.py).
#
# This file is hand-maintained: adding a new scenario requires writing the
# narrative first, then registering the handle here, then re-running the
# emitter and validator.
#
# Cross-references in this file:
#   - voice: must exist as a Piper voice name (not validated here — the
#     validator only checks intra-canonical consistency).
#   - default_wake_words: every entry must be in canonical/wake_words.yaml
#   - default_intent_allowlist: every entry must be in canonical/wake_words.yaml
#   - hardware_modules: every entry must be in canonical/hardware_modules.yaml
#   - default_tools: every entry must be in canonical/tools.yaml

version: 1

scenarios:

  - id: space_command_launch
    title: Space Command — Launch Control Center
    status: authored
    voice: ryan
    narrative_path: narratives/scenarios/space_command_launch/narrative.md
    emitted_path: narratives/scenarios/space_command_launch/_emitted/scenario.yaml
    default_wake_words:
      - computer
      - mission_control
      - flight
    default_intent_allowlist:
      - launch
      - abort
      - status
      - arm
      - disarm
      - help
    default_tools:
      # Generic tools — see canonical/tools.yaml
      - play_sfx
      - set_led
      - set_leds_range
      - clear_leds
      - write_lcd
      - clear_lcd
      - render_oled_status
      - render_oled_alert
      - render_oled_text
      - set_switch_indicator_led
      # Scenario-specific tools
      - initiate_launch_sequence
      - hold_countdown
      - range_safety_destruct
    hardware_modules:
      - rp2040_metro
      - sim_panel
      - ch358_sound
      - lcd_1602
      - oled_b
      - oled_master

