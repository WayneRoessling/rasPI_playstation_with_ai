# Hardware modules — physical inventory of every controller, sensor,
# actuator, and display that participates in the overlay
#
# Each module has a stable `id` (used in scenarios.yaml hardware_modules
# fields) and a `kind` so the validator can group them.
#
# Cross-references:
#   - displays of kind=display must each appear in canonical/displays.yaml
#     with a matching id.
#   - controllers list `talks` capability list — these are the protocol
#     `caps` advertised in the `hello` event.

version: 1

modules:

  # ── Controllers ───────────────────────────────────────────────────────

  - id: rp2040_metro
    kind: controller
    physical: Adafruit Metro RP2040 (CircuitPython)
    transport: usb_cdc
    talks:
      - switches
      - leds
      - lcd
      - oled
      - sfx
      - ptt
      - pir
      - key
    notes: Primary panel controller; firmware in overlay/firmware/rp2040.

  - id: nicla_voice
    kind: controller
    physical: Arduino Nicla Voice (Syntiant NDP120)
    transport: usb_cdc
    talks:
      - wake
      - intent
    notes: Wake-word + keyword classifier. Events-only; consumes no commands.

  - id: sim_panel
    kind: controller
    physical: Browser-based simulator (overlay/sim)
    transport: websocket
    talks:
      - switches
      - leds
      - lcd
      - oled
      - sfx
      - ptt
      - pir
      - key
      - wake
      - intent
    notes: Drop-in stand-in for rp2040_metro+nicla_voice. Single endpoint.

  # ── Sound ─────────────────────────────────────────────────────────────

  - id: ch358_sound
    kind: sound_module
    physical: CH358D TF-1G card-reader sound module + 10 K-pin NPN drivers
    transport: gpio
    talks:
      - sfx
    notes: |
      Slot count is fixed at 10 (K1..K10). WAVs on the TF card are
      generated by overlay/tools/generate_sfx.py. K-pin trigger pulse
      width tuned in firmware.

  # ── Displays ──────────────────────────────────────────────────────────

  - id: lcd_1602
    kind: display
    physical: 1602 character LCD with I2C backpack
    transport: i2c
    talks: [lcd]
    notes: Panel A; declared in canonical/displays.yaml as lcd_1602.

  - id: oled_b
    kind: display
    physical: 0.96" 128x64 I2C OLED (panel B)
    transport: i2c
    talks: [oled]
    notes: Panel B; declared in canonical/displays.yaml as oled_b.

  - id: oled_master
    kind: display
    physical: 1.3" STEMMA QT 128x64 OLED (master status)
    transport: i2c
    talks: [oled]
    notes: Master status; declared in canonical/displays.yaml as oled_master.

  # ── Inputs (sensors & switches are aggregate-tracked) ─────────────────

  - id: switch_bank
    kind: input
    physical: 10 silver bat toggles + PTT button + PIR + MT-301 key
    transport: gpio
    talks: [switches, ptt, pir, key]
    notes: Catalogued switch-by-switch in canonical/switches.yaml.

  # ── Pi 5 host ─────────────────────────────────────────────────────────

  - id: pi5_host
    kind: host
    physical: Raspberry Pi 5 (4 GB or 8 GB)
    transport: n/a
    talks: []
    notes: Runs voice_pipeline.py + overlay.scenario runtime + pi5_hal client.

  # ── Audio I/O on the host ─────────────────────────────────────────────

  - id: yahboom_audio
    kind: audio_io
    physical: Yahboom USB audio mic + speaker
    transport: usb
    talks: []
    notes: Captures user speech; plays Piper TTS + scenario beds.
