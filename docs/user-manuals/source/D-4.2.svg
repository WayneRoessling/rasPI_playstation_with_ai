<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Two female-to-male jumper wires running from the Raspberry Pi 5 GPIO header to the breadboard power rails. A red jumper runs from Pi pin 2 (5 volts) to the breadboard red plus rail. A black jumper runs from Pi pin 6 (GND) to the breadboard black minus rail. Only pins 1 through 6 of the header are shown; the rest of the header continues off the right side.">
  <title>D-4.2 — Two jumpers from Pi 5 pins 2 and 6 to the breadboard rails</title>
  <desc>Side-by-side schematic. On the left, the corner of the Raspberry Pi 5 GPIO header is drawn showing pins 1 through 6 with pin 2 highlighted red (5V) and pin 6 highlighted black (GND). On the right, a section of the breadboard is drawn with its red (+) rail along the top and its black (−) rail below it. A red curved wire runs from pin 2 down and across to the red rail. A black curved wire runs from pin 6 down and across to the black rail. Each wire has a small "F" label at its female end (Pi side) and "M" label at its male end (breadboard side).</desc>

  <style>
    .title       { font: 600 18px system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #111; }
    .sub         { font: 12px system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #333; }
    .label-big   { font: 600 14px system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #111; }
    .label       { font: 600 13px system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #111; }
    .small       { font: 12px system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #333; }
    .tiny        { font: 10px system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #555; }
    .callout     { font: 600 12px system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #111; }
    .pin-num     { font: 600 11px system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ffffff; }

    .pi-board    { fill: #1a4f2a; stroke: #0b3018; stroke-width: 1.4; }
    .header-base { fill: #2a2a2a; stroke: #111; stroke-width: 2; }
    .pin-neutral { fill: #888; stroke: #444; stroke-width: 1; }
    .pin-5v      { fill: #cc1f1f; stroke: #7a0f0f; stroke-width: 1.4; }
    .pin-33v     { fill: #d97a1f; stroke: #7a3a0f; stroke-width: 1.4; }
    .pin-gnd     { fill: #111; stroke: #000; stroke-width: 1.4; }

    .fn          { font: 10px system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #333; }
    .fn-power    { font: 600 10px system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #cc1f1f; }
    .fn-gnd      { font: 600 10px system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #111; }

    .board       { fill: #ffffff; stroke: #111; stroke-width: 2; }
    .strip-pos   { fill: #f7d9d9; stroke: #cc1f1f; stroke-width: 1.2; }
    .strip-neg   { fill: #dadada; stroke: #111;    stroke-width: 1.2; }
    .hole        { fill: #ffffff; stroke: #444; stroke-width: 0.6; }

    .wire-red    { stroke: #cc1f1f; stroke-width: 4; fill: none; stroke-linecap: round; }
    .wire-black  { stroke: #111;    stroke-width: 4; fill: none; stroke-linecap: round; }
    .badge-red   { fill: #cc1f1f; stroke: #7a0f0f; stroke-width: 1; }
    .badge-blk   { fill: #111; stroke: #000; stroke-width: 1; }
    .badge-grey  { fill: #888; stroke: #444; stroke-width: 1; }
    .badge-txt   { font: 600 10px system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #ffffff; }
    .arrow       { stroke: #111; stroke-width: 1.5; fill: none; }
  </style>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#111"/>
    </marker>
  </defs>

  <!-- Page background -->
  <rect width="1100" height="560" fill="#ffffff"/>

  <!-- ============================================================ -->
  <!--  Title strip                                                  -->
  <!-- ============================================================ -->
  <text x="20" y="28" class="title">D-4.2 — Two jumpers from Pi 5 pins 2 and 6 to the breadboard rails</text>
  <text x="20" y="48" class="sub">Red jumper: Pi pin 2 (+5 V) -> breadboard + rail.   Black jumper: Pi pin 6 (GND) -> breadboard - rail.   Only pins 1-6 of the header are drawn.</text>

  <!-- ============================================================ -->
  <!--  Top legend row: F/M key on the left, WARNING on the right    -->
  <!-- ============================================================ -->
  <g id="fm-legend">
    <rect x="20" y="64" width="500" height="40" fill="#ffffff" stroke="#888" stroke-width="1" rx="4"/>
    <rect x="34" y="76" width="22" height="16" rx="3" class="badge-grey"/>
    <text x="45" y="88" text-anchor="middle" class="badge-txt">F</text>
    <text x="64" y="89" class="tiny">= female end (a hole that fits over a pin)</text>
    <rect x="290" y="76" width="22" height="16" rx="3" class="badge-grey"/>
    <text x="301" y="88" text-anchor="middle" class="badge-txt">M</text>
    <text x="320" y="89" class="tiny">= male end (a pin that fits into a hole)</text>
  </g>
  <g id="power-warning">
    <rect x="540" y="64" width="540" height="40" fill="#fdecec" stroke="#cc1f1f" stroke-width="1.4" rx="4"/>
    <text x="558" y="89" class="callout" fill="#cc1f1f">Unplug the Pi from power before wiring anything to the GPIO header.</text>
  </g>

  <!-- ============================================================ -->
  <!--  LEFT: Pi 5 corner with pins 1..6                             -->
  <!-- ============================================================ -->
  <g id="pi-corner">
    <!-- pcb background -->
    <rect x="40" y="140" width="320" height="280" rx="6" class="pi-board"/>
    <text x="200" y="162" text-anchor="middle" class="tiny" fill="#cfe4d5">Raspberry Pi 5 (corner)</text>
    <text x="50" y="412" class="tiny" fill="#cfe4d5">SD-card slot side (pin 1)</text>

    <!-- header strip (just the corner; pins 1..6 plus a "..." continuation) -->
    <rect x="80" y="190" width="240" height="120" rx="3" class="header-base"/>

    <!--
      Pin centres (3 visible columns then "..."):
        Top row    (pins 1, 3, 5): y centre = 212
        Bottom row (pins 2, 4, 6): y centre = 268
        Column centres x = 120, 180, 240
    -->

    <!-- Top row: pins 1, 3, 5 -->
    <rect x="100" y="200" width="40" height="26" rx="3" class="pin-33v"/>
    <text x="120" y="218" text-anchor="middle" class="pin-num">1</text>
    <text x="120" y="186" text-anchor="middle" class="fn-power">3V3</text>

    <rect x="160" y="200" width="40" height="26" rx="3" class="pin-neutral"/>
    <text x="180" y="218" text-anchor="middle" class="pin-num">3</text>
    <text x="180" y="186" text-anchor="middle" class="fn">GPIO2 (SDA)</text>

    <rect x="220" y="200" width="40" height="26" rx="3" class="pin-neutral"/>
    <text x="240" y="218" text-anchor="middle" class="pin-num">5</text>
    <text x="240" y="186" text-anchor="middle" class="fn">GPIO3 (SCL)</text>

    <!-- Bottom row: pins 2, 4, 6 -->
    <rect x="100" y="256" width="40" height="26" rx="3" class="pin-5v"/>
    <text x="120" y="274" text-anchor="middle" class="pin-num">2</text>
    <text x="120" y="300" text-anchor="middle" class="fn-power">5 V</text>

    <rect x="160" y="256" width="40" height="26" rx="3" class="pin-5v"/>
    <text x="180" y="274" text-anchor="middle" class="pin-num">4</text>
    <text x="180" y="300" text-anchor="middle" class="fn-power">5 V</text>

    <rect x="220" y="256" width="40" height="26" rx="3" class="pin-gnd"/>
    <text x="240" y="274" text-anchor="middle" class="pin-num">6</text>
    <text x="240" y="300" text-anchor="middle" class="fn-gnd">GND</text>

    <!-- Continuation: pins 7..40 -->
    <text x="285" y="218" text-anchor="middle" class="tiny" fill="#cfe4d5">. . .</text>
    <text x="285" y="274" text-anchor="middle" class="tiny" fill="#cfe4d5">. . .</text>
    <text x="200" y="340" text-anchor="middle" class="tiny" fill="#cfe4d5">(pins 7-40 continue to the right)</text>
  </g>

  <!-- ============================================================ -->
  <!--  RIGHT: Breadboard section with + and − rails                 -->
  <!-- ============================================================ -->
  <g id="breadboard-section">
    <rect x="540" y="140" width="500" height="280" rx="6" class="board"/>
    <text x="790" y="162" text-anchor="middle" class="tiny">Breadboard (left end)</text>

    <!-- + rail -->
    <rect x="560" y="200" width="380" height="22" rx="2" class="strip-pos"/>
    <text x="550" y="215" text-anchor="end" class="callout" fill="#cc1f1f">+</text>
    <text x="950" y="215" class="tiny">+ rail (red stripe)</text>
    <text x="950" y="227" class="tiny">every hole = +5 V</text>
    <!-- holes on + rail -->
    <g>
      <circle cx="580" cy="211" r="2.8" class="hole"/>
      <circle cx="608" cy="211" r="2.8" class="hole"/>
      <circle cx="636" cy="211" r="2.8" class="hole"/>
      <circle cx="664" cy="211" r="2.8" class="hole"/>
      <circle cx="692" cy="211" r="2.8" class="hole"/>
      <circle cx="720" cy="211" r="2.8" class="hole"/>
      <circle cx="748" cy="211" r="2.8" class="hole"/>
      <circle cx="776" cy="211" r="2.8" class="hole"/>
      <circle cx="804" cy="211" r="2.8" class="hole"/>
      <circle cx="832" cy="211" r="2.8" class="hole"/>
      <circle cx="860" cy="211" r="2.8" class="hole"/>
      <circle cx="888" cy="211" r="2.8" class="hole"/>
      <circle cx="916" cy="211" r="2.8" class="hole"/>
    </g>

    <!-- − rail -->
    <rect x="560" y="232" width="380" height="22" rx="2" class="strip-neg"/>
    <text x="550" y="247" text-anchor="end" class="callout" fill="#111">−</text>
    <text x="950" y="247" class="tiny">- rail (black/blue stripe)</text>
    <text x="950" y="259" class="tiny">every hole = GND</text>
    <!-- holes on − rail -->
    <g>
      <circle cx="580" cy="243" r="2.8" class="hole"/>
      <circle cx="608" cy="243" r="2.8" class="hole"/>
      <circle cx="636" cy="243" r="2.8" class="hole"/>
      <circle cx="664" cy="243" r="2.8" class="hole"/>
      <circle cx="692" cy="243" r="2.8" class="hole"/>
      <circle cx="720" cy="243" r="2.8" class="hole"/>
      <circle cx="748" cy="243" r="2.8" class="hole"/>
      <circle cx="776" cy="243" r="2.8" class="hole"/>
      <circle cx="804" cy="243" r="2.8" class="hole"/>
      <circle cx="832" cy="243" r="2.8" class="hole"/>
      <circle cx="860" cy="243" r="2.8" class="hole"/>
      <circle cx="888" cy="243" r="2.8" class="hole"/>
      <circle cx="916" cy="243" r="2.8" class="hole"/>
    </g>

    <!-- main board area (greyed, just to suggest it continues) -->
    <rect x="560" y="270" width="380" height="120" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="750" y="335" text-anchor="middle" class="tiny" fill="#888">(main breadboard field - empty for now)</text>
  </g>

  <!-- ============================================================ -->
  <!--  WIRES                                                        -->
  <!-- ============================================================ -->
  <!--
    Red jumper: Pi pin 2 bottom (x=120, y=282) -> breadboard + rail hole (636, 211).
                Curve arches down then back up.
    Black jumper: Pi pin 6 bottom (x=240, y=282) -> breadboard - rail hole (720, 243).
                Curve arches further down so it doesn't cross the red one.
  -->

  <!-- Red wire -->
  <g id="red-jumper">
    <path d="M 120 282 C 120 420, 636 460, 636 222" class="wire-red"/>
    <!-- F badge near Pi pin 2 (placed off to the left so it doesn't sit on the "5 V" label) -->
    <rect x="68" y="305" width="22" height="16" rx="3" class="badge-red"/>
    <text x="79" y="317" text-anchor="middle" class="badge-txt">F</text>
    <path d="M 90 313 L 116 290" class="arrow" stroke="#cc1f1f" stroke-width="1.4"/>

    <!-- M badge near the breadboard + rail hole -->
    <rect x="620" y="178" width="22" height="16" rx="3" class="badge-red"/>
    <text x="631" y="190" text-anchor="middle" class="badge-txt">M</text>
    <path d="M 631 194 L 634 207" class="arrow" stroke="#cc1f1f" stroke-width="1.4"/>
  </g>

  <!-- Black wire -->
  <g id="black-jumper">
    <path d="M 240 282 C 240 490, 720 510, 720 254" class="wire-black"/>
    <!-- F badge near Pi pin 6 -->
    <rect x="265" y="305" width="22" height="16" rx="3" class="badge-blk"/>
    <text x="276" y="317" text-anchor="middle" class="badge-txt">F</text>
    <path d="M 265 313 L 244 290" class="arrow" stroke="#111" stroke-width="1.4"/>

    <!-- M badge near the breadboard - rail hole -->
    <rect x="704" y="262" width="22" height="16" rx="3" class="badge-blk"/>
    <text x="715" y="274" text-anchor="middle" class="badge-txt">M</text>
    <!-- arrow points up to the - rail hole at (720,243) -->
    <path d="M 718 262 L 720 254" class="arrow" stroke="#111" stroke-width="1.4"/>
  </g>

  <!-- ============================================================ -->
  <!--  Bottom callouts                                              -->
  <!-- ============================================================ -->
  <g>
    <rect x="40" y="450" width="500" height="80" fill="#fdecec" stroke="#cc1f1f" stroke-width="1.4" rx="6"/>
    <text x="56" y="472" class="label-big" fill="#cc1f1f">Red female-to-male jumper</text>
    <text x="56" y="492" class="small">1. Slide the female (F) end onto Pi <tspan font-weight="700">pin 2</tspan> (+5 V).</text>
    <text x="56" y="510" class="small">2. Push the male (M) end into any hole on the breadboard <tspan font-weight="700">+ rail</tspan>.</text>
  </g>
  <g>
    <rect x="560" y="450" width="500" height="80" fill="#f4f4f4" stroke="#111" stroke-width="1.4" rx="6"/>
    <text x="576" y="472" class="label-big">Black female-to-male jumper</text>
    <text x="576" y="492" class="small">1. Slide the female (F) end onto Pi <tspan font-weight="700">pin 6</tspan> (GND).</text>
    <text x="576" y="510" class="small">2. Push the male (M) end into any hole on the breadboard <tspan font-weight="700">- rail</tspan>.</text>
  </g>

</svg>
